services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thesis_saas}
      POSTGRES_USER: ${POSTGRES_USER:-thesis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_pg_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thesis_user} -d ${POSTGRES_DB:-thesis_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-change_me_minio_secret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: Multi-School Thesis Repository Cloud API
      ENV: production
      API_PREFIX: /api
      SECRET_KEY: ${SECRET_KEY:-replace_with_long_random_64_char_secret}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-thesis_user}:${POSTGRES_PASSWORD:-change_me_pg_password}@postgres:5432/${POSTGRES_DB:-thesis_saas}
      DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-gimpa}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-https://thesis.example.com}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-thesis.example.com}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-platform-admin@thesiscloud.org}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-ChangeMePlatformAdmin#2026}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_BUCKET: ${S3_BUCKET:-thesis-repository-private}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-change_me_minio_secret}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Multi-School Thesis Repository}
    volumes:
      - tenant_uploads:/app/uploads
    ports:
      - "8011:8011"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      VITE_API_URL: ""
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/multi-tenant.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pg_data:
  minio_data:
  tenant_uploads:
